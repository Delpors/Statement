<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Вход в систему</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">
</head>
<body class="form-centered">
<div class="form-container">
    <div class="form-header">
        <h2>
            <i class="bi bi-person-gear"></i>
            Вход в систему
        </h2>

    </div>
    <div th:if="${message}" th:text="${message}" style="color: green;"></div>
    <div th:if="${error}" th:text="${error}" style="color: red;"></div>
    <form th:action="@{/login}" method="post">
        <div class="row">
            <div class="col-12 mb-3">
                <input type="text" class="form-control" name="username" required
                       placeholder="Введите имя пользователя">
            </div>

            <div class="col-12 mb-3">
                <input type="text" class="form-control" name="password" required
                       placeholder="Ведите пароль">
            </div>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-submit text-white">
                <i class="bi bi-check-circle"></i> Войти
            </button>
            <a th:href="@{/register}" class="btn btn-submit text-white"
               style="background: linear-gradient(135deg, #3498db, #2980b9); border: none; color: white; margin-bottom: 20px;">
                <i class="bi bi-building"></i> Зарегистрироваться
            </a>
        </div>
    </form>
</div>
</body>
</html>
