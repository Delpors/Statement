<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список расчетно-платежных ведомостей</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand">
            <i class="bi bi-building me-2"></i>
            ВОС
            <span th:if="${selectedInstitution != null}"
                  class="badge bg-light text-dark ms-2"
                  th:text="${selectedInstitution.institutionAbbrev}">
            </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/home}"><i class="bi bi-house me-1"></i> Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-person-circle me-1"></i> Выход</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container-fluid mt-4">
    <div class="text-center mb-4">
        <h1 class="display-5">Список расчетно-платежных ведомостей</h1>
    </div>
    <a th:href="@{/payroll/payrollItems/create}"  class="btn btn-edit"
       style="background: linear-gradient(135deg, #3498db, #2980b9); border: none; color: white; margin-bottom: 20px;">
        <i class="bi bi-table"></i> Сформировать
    </a>
    <form id="payrollForm">
        <div class="table-responsive">
            <table class="table professional-theme">
                <thead class="table-light">
                <tr>
                    <th class="text-center fixed-col-small">№</th>
                    <th class="text-center fixed-col-name">Период</th>
                    <th class="text-center fixed-col-name">Начислено</th>
                    <th class="text-center fixed-col-name">Профсоюзный</br>взнос</th>
                    <th class="text-center fixed-col-name">НДФЛ</th>
                    <th class="text-center fixed-col-name">Аванс</th>
                    <th class="text-center fixed-col-name">К выдаче</th>
                    <th class="text-center fixed-col-name">Дата</br>выплаты</th>
                    <th class="text-center fixed-col-name">Дата</br>формирования</th>
                    <th class="text-center fixed-col-name">Был</br>изменен</th>
                    <th class="text-center fixed-col-name">Действия</th>

                </tr>
                </thead>
                <tbody>
                <tr th:each="payroll, stat : ${payroll}"
                    th:data-payroll-id="${payroll.payrollId()}"
                    class="payroll-row">

                    <td class="text-center fixed-col-small" th:text="${stat.index + 1}">1</td>
                    <td class="text-center fixed-col-position" th:text="${payroll.period()}"></td>
                    <td class="text-end fixed-col-position" th:text="${payroll.totalIncome()}"></td>
                    <td class="text-end fixed-col-position" th:text="${payroll.totalUnionFee()}"></td>
                    <td class="text-end fixed-col-position" th:text="${payroll.totalIncomeTax()}"></td>
                    <td class="text-end fixed-col-position" th:text="${payroll.totalAdvance()}"></td>
                    <td class="text-end fixed-col-position" th:text="${payroll.totalIssued()}"></td>
                    <td class="text-center fixed-col-position" th:text="${payroll.payrollDate()}"></td>
                    <td class="text-center fixed-col-position"
                        th:text="${#temporals.format(payroll.createdAt(), 'dd.MM.yyyy HH:mm')}">
                    </td>
                    <td class="text-center fixed-col-position"
                        th:text="${#temporals.format(payroll.updatedAt(), 'dd.MM.yyyy HH:mm')}">
                    </td>
                    <td class="text-center">
                        <a th:href="@{/payroll/payrollItems/edit/{payrollId}(payrollId=${payroll.payrollId})}" class="btn btn-edit">
                            <i class="bi bi-pen"></i>
                        </a>
                        <a th:href="@{/payroll/{id}(id=${payroll.payrollId()})}" class="btn btn-danger"
                           onclick="return confirm('Вы уверены, что хотите удалить эту запись?')">
                            <i class="bi bi-trash"></i>
                        </a>
                    </td>
                </tr>
                <tr class="total-row">
                    <td colspan="2" class="text-start"><strong>ИТОГО:</strong></td>
                    <td class="text-end calculated-cell" id="grand-total-income">0.00</td>
                    <td class="text-end" id="grand-total-unionFee">0.00</td>
                    <td class="text-end" id="grand-total-incomeTax">0.00</td>
                    <td class="text-end" id="grand-total-advance">0.00</td>
                    <td class="text-end calculated-cell" id="grand-total-issued">0.00</td>
                    <td colspan="4"></td>
                </tr>
                </tbody>
            </table>
            <div class="d-flex gap-3 justify-content-end">
                <a th:href="@{/home}" class="btn btn-cancel text-white">
                    <i class="bi bi-arrow-left me-2"></i> Назад
                </a>
            </div>
        </div>
    </form>
</div>
<script>
    // Функция для расчета общих итогов
    function calculateGrandTotals() {
        let totalEmployeeIncome = 0;
        let totalUnionFee = 0;
        let totalIncomeTax = 0;
        let totalAdvance = 0;
        let totalIssued = 0;

        // Получаем все строки данных (исключая итоговую строку)
        const rows = document.querySelectorAll('tbody tr:not(.total-row)');

        rows.forEach(row => {
            // Получаем ячейки текущей строки
            const cells = row.querySelectorAll('td');

            // Суммируем значения из каждой колонки
            totalEmployeeIncome += parseFloat(cells[2].textContent) || 0;   // Всего начислено
            totalUnionFee += parseFloat(cells[3].textContent) || 0;         // Проф взнос
            totalIncomeTax += parseFloat(cells[4].textContent) || 0;        // НДФЛ
            totalAdvance += parseFloat(cells[5].textContent) || 0;          // Аванс
            totalIssued += parseFloat(cells[6].textContent) || 0;           // К выдаче
        });

        // Обновляем итоговую строку
        document.getElementById('grand-total-income').textContent = totalEmployeeIncome.toFixed(2);
        document.getElementById('grand-total-unionFee').textContent = totalUnionFee.toFixed(2);
        document.getElementById('grand-total-incomeTax').textContent = totalIncomeTax.toFixed(2);
        document.getElementById('grand-total-advance').textContent = totalAdvance.toFixed(2);
        document.getElementById('grand-total-issued').textContent = totalIssued.toFixed(2);
    }
    // Функция для форматирования чисел (если нужно)
    function formatNumber(value) {
        return parseFloat(value).toFixed(2);
    }
    // Функция для обработки двойного щелчка по строке
    function handleRowDoubleClick(event) {
        const row = event.target.closest('.payroll-row');

        if (row) {
            const payrollId = row.getAttribute('data-payroll-id');

             window.location.href = `/payroll/payrollItems/${encodeURIComponent(payrollId)}`;
        }
    }
    // Автоматический расчет при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {

        // Выполняем первоначальный расчет
        calculateGrandTotals();
        console.log('Итоги рассчитаны автоматически');

        // Добавляем обработчики событий для строк
        const payrollRows = document.querySelectorAll('.payroll-row');
        payrollRows.forEach(row => {
            row.addEventListener('dblclick', handleRowDoubleClick);
        });
    });
</script>
</body>
</html>
