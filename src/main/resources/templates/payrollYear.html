<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Сформировать ведомость</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">
</head>
<body>
<div class="container-fluid mt-4">
    <div class="text-center mb-4">
        <h1 class="display-5">Расчетно-платежная ведомость</h1>
    </div>

    <div th:if="${param.success}" class="alert alert-success">
        Данные успешно сохранены!
    </div>
    <div th:if="${param.error}" class="alert alert-danger">
        Ошибка при сохранении данных!
    </div>

    <form id="payrollForm">
        <div class="table-responsive">
            <table class="table professional-theme">
                <thead class="table-light">
                <tr>
                    <th rowspan="2" class="text-center fixed-col-small">№</th>
                    <th rowspan="2" class="text-center fixed-col-name">ФИО</th>

                    <!-- Генерация месяцев через Thymeleaf -->
                    <th th:each="month : ${#numbers.sequence(1, 12)}"
                        th:colspan="3"
                        th:class="'text-center table-success'"
                        th:text="${T(java.time.Month).of(month).getDisplayName(
                   T(java.time.format.TextStyle).FULL_STANDALONE,
                   T(java.util.Locale).forLanguageTag('ru'))}">
                    </th>

                    <th rowspan="2" class="text-center fixed-col-name">Всего ЗП</th>
                    <th rowspan="2" class="text-center fixed-col-name">Всего НДФЛ</th>
                    <th rowspan="2" class="text-center fixed-col-name">Всего прфсоюз</th>
                </tr>
                <tr>
                    <th th:each="i : ${#numbers.sequence(1, 36)}"
                        th:class="'text-center table-success'"
                        th:text="${(i % 3 == 1) ? 'ЗП' : ((i % 3 == 2) ? 'НДФЛ' : 'ПВ')}">
                    </th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="employee, stat : ${employees}"
                    th:data-employee-id="${employee.employee_id}"
                    th:data-salary="${employee.salary}"
                    th:data-nontaxable="${employee.nonTaxable}">

                    <td class="text-center fixed-col-small" th:text="${stat.index + 1}">1</td>
                </tr>
                </tbody>
            </table>
        </div>
    </form>
</div>
</body>
</html>
