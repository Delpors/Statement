<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Регистрация пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">
</head>
<body class="form-centered">
<div class="form-container">
    <div class="form-header">
        <h2>
            <i class="bi bi-person-gear"></i>
            Зарегистрировать пользователя
        </h2>
    </div>
    <form th:action="@{/register}" th:object="${user}" method="post">
        <div class="row">
            <div class="col-12 mb-3">
                <input type="text" class="form-control" th:field="*{userName}"
                       placeholder="Введите имя пользователя"/>
                <span th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></span>
            </div>

            <div class="col-12 mb-3">
                <input type="password" class="form-control" th:field="*{password}"
                       placeholder="Введите пароль"/>
                <span th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div class="col-12 mb-3">
                <input type="password" class="form-control"th:field="*{confirmPassword}"
                       placeholder="Повторите пароль"/>
                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </div>

            <div class="col-12 mb-3">
                <input type="email" class="form-control"th:field="*{email}"
                       placeholder="Введите адрес электронной почты"/>
            </div>
        </div>
        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-submit text-white">
                <i class="bi bi-check-circle"></i> Зарегистрироваться
            </button>
            <a th:href="@{/login}" class="btn btn-cancel text-white">
                <i class="bi bi-x-circle me-2"></i>Отмена
            </a>
        </div>
    </form>
</div>
</body>
</html>>
