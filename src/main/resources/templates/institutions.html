<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список сотрудников</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">

</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand">
            <i class="bi bi-building me-2"></i>
            ВОС
            <span th:if="${selectedInstitution != null}"
                  class="badge bg-light text-dark ms-2"
                  th:text="${selectedInstitution.institutionAbbrev}">
            </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/home}"><i class="bi bi-house me-1"></i> Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-person-circle me-1"></i> Выход</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="container-fluid mt-4">
    <div class="text-center mb-4">
        <h1 class="display-5">Организации</h1>
    </div>
    <a th:href="@{/institutions/create}" class="btn btn-edit btn btn-edit mb-3">
        <i class="bi bi-building"></i> Добавить
    </a>
    <table class="table professional-theme">
        <thead>
        <tr>
            <th class="text-center">№</th>
            <th class="text-center">Полное </br> наименование</th>
            <th class="text-center">Короткое </br> наименование</th>
            <th class="text-center">Руковолитель</th>
            <th class="text-center">Главный </br> бухгалтер</th>
            <th class="text-center">Исполнитель</th>
            <th class="text-center">Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="institution, stat : ${institutions}">
            <td class="text-center" th:text="${stat.index + 1}">1</td>
            <td th:text="${institution.institutionFullName()}"></td>
            <td th:text="${institution.institutionAbbrev()}"></td>
            <td th:text="${institution.director()}"></td>
            <td class="text-center" th:text="${institution.generalAccountant()}"></td>
            <td class="text-end" th:text="${institution.accountant()}"></td>
            <td class="text-center">
                <a th:href="@{/institutions/edit/{id}(id=${institution.institution_Id()})}" class="btn btn-edit">
                    <i class="bi bi-pen"></i>
                </a>
                <a th:href="@{/institutions/{id}(id=${institution.institution_Id()})}" class="btn btn-danger"
                   onclick="return confirm('Вы уверены, что хотите удалить эту запись?')">
                    <i class="bi bi-trash"></i>
                </a>
            </td>
        </tr>
        </tbody>
    </table>
    <div class="d-flex gap-3 justify-content-end">
        <a th:href="@{/}" class="btn btn-cancel text-white">
            <i class="bi bi-arrow-left me-2"></i> Назад
        </a>
    </div>
</div>
</body>
</html>
