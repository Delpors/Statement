<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Выбрать организацию</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">
</head>
<body class="form-centered">
<div class="form-container">
    <div class="form-header">
        <h2>
            <i class="bi bi-building"></i>
            Выберите организацию
        </h2>
    </div>

    <form th:action="@{/}" th:object="${institutionEntity}" method="post">
        <div class="mb-3">
            <label for="institutionSelect" class="form-label">
                <i class="bi bi-buildings"></i> Организация *
            </label>
            <select class="form-select text-center" id="institutionSelect" th:field="*{id}" required>
                <option value=""> Выберите организацию </option>
                <option th:each="inst : ${institutions}"
                        th:value="${inst.institution_Id}"
                        th:text="${inst.institutionAbbrev}">
                </option>
            </select>
        </div>

        <div class="d-grid gap-2">
            <button type="submit" class="btn btn-submit text-white">
                <i class="bi bi-check-circle"></i> Выбрать
            </button>
            <a th:href="@{/institutions}" class="btn btn-submit text-white"
               style="background: linear-gradient(135deg, #3498db, #2980b9); border: none; color: white; margin-bottom: 20px;">
                <i class="bi bi-building"></i> Организации
            </a>
        </div>

    </form>
</div>
</body>
</html>
