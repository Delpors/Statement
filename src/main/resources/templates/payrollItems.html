<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ведомость</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand">
            <i class="bi bi-building me-2"></i>
            ВОС
            <span th:if="${selectedInstitution != null}"
                  class="badge bg-light text-dark ms-2"
                  th:text="${selectedInstitution.institutionAbbrev}">
            </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/home}"><i class="bi bi-house me-1"></i> Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-person-circle me-1"></i> Выход</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container-fluid mt-4">
    <div class="text-center mb-4">
        <h1 class="display-5">Расчетно-платежная ведомость</h1>
        <div th:if="${not #lists.isEmpty(payroll_items) and payroll_items[0].period() != null}"
             class="display-6"
             th:text="${payroll_items[0].period()}">
        </div>
    </div>
    <div class="d-flex gap-3 justify-content-left mb-4">
        <a th:href="@{/payroll}" class="btn btn-cancel text-white">
            <i class="bi bi-arrow-left me-2"></i> Назад
        </a>
    </div>
    <form id="payrollForm">
        <div class="table-responsive">
            <table class="table professional-theme">
                <thead class="table-light">
                <tr>
                    <th rowspan="2" class="text-center fixed-col-small">№</th>
                    <th rowspan="2" class="text-center fixed-col-name">ФИО</th>
                    <th rowspan="2" class="text-center fixed-col-position">Должность</th>
                    <th colspan="5" class="text-center table-success">Начисления</th>
                    <th rowspan="2" class="text-center table-success calculated-cell">Всего</br>начислено</th>
                    <th colspan="4" class="text-center table-danger">Удержания</th>
                    <th rowspan="2" class="text-center table-danger calculated-cell">Всего</br>удержано</th>
                    <th rowspan="2" class="text-center table-primary calculated-cell">К выдаче</th>
                </tr>
                <tr>
                    <th class="text-center table-success">Оклад</th>
                    <th class="text-center table-success">Премия</th>
                    <th class="text-center table-success">ФСС</th>
                    <th class="text-center table-success">Замещение</th>
                    <th class="text-center table-success">Классное</br>руководство</th>

                    <th class="text-center table-danger">Прогулы</th>
                    <th class="text-center table-danger">Проф взнос</th>
                    <th class="text-center table-danger">НДФЛ</th>
                    <th class="text-center table-danger">Аванс</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payrollItems, stat : ${payroll_items}">
                    <td class="text-center fixed-col-small" th:text="${stat.index + 1}">1</td>
                    <td class="fixed-col-name" th:text="${payrollItems.fullName()}"></td>
                    <td class="fixed-col-name" th:text="${payrollItems.position}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.baseSalary, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.bonus, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.fss, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.replace, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.otherIncome, 1, 2, 'COMMA')}"></td>
                    <td class="text-end calculated-cell" th:text="${#numbers.formatDecimal(payrollItems.totalEmployeeIncome, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.absent, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.unionFee, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.incomeTax, 1, 2, 'COMMA')}"></td>
                    <td class="text-end" th:text="${#numbers.formatDecimal(payrollItems.advance, 1, 2, 'COMMA')}"></td>
                    <td class="text-end calculated-cell" th:text="${#numbers.formatDecimal(payrollItems.totalEmployeeDeduction, 1, 2, 'COMMA')}"></td>
                    <td class="text-end calculated-cell" th:text="${#numbers.formatDecimal(payrollItems.totalIssued, 1, 2, 'COMMA')}"></td>
                </tr>
                <tr class="total-row">
                    <td colspan="3" class="text-start"><strong>ИТОГО:</strong></td>
                    <td class="text-end" id="grand-total-salary">0.00</td>
                    <td class="text-end" id="grand-total-bonus">0.00</td>
                    <td class="text-end" id="grand-total-fss">0.00</td>
                    <td class="text-end" id="grand-total-replace">0.00</td>
                    <td class="text-end" id="grand-total-otherIncome">0.00</td>
                    <td class="text-end calculated-cell" id="grand-total-income">0.00</td>
                    <td class="text-end" id="grand-total-absent">0.00</td>
                    <td class="text-end" id="grand-total-unionFee">0.00</td>
                    <td class="text-end" id="grand-total-incomeTax">0.00</td>
                    <td class="text-end" id="grand-total-advance">0.00</td>
                    <td class="text-end calculated-cell" id="grand-total-deduction">0.00</td>
                    <td class="text-end calculated-cell" id="grand-total-issued">0.00</td>
                </tr>
                </tbody>
            </table>

        </div>
    </form>
</div>

<script>
    function calculateGrandTotals() {
        let totalBaseSalary = 0;
        let totalBonus = 0;
        let totalFss = 0;
        let totalReplace = 0;
        let totalOtherIncome = 0;
        let totalEmployeeIncome = 0;
        let totalAbsent = 0;
        let totalUnionFee = 0;
        let totalIncomeTax = 0;
        let totalAdvance = 0;
        let totalEmployeeDeduction = 0;
        let totalIssued = 0;

        const rows = document.querySelectorAll('tbody tr:not(.total-row)');

        rows.forEach(row => {
            const cells = row.querySelectorAll('td');

            totalBaseSalary += parseFloat(cells[3].textContent.replace(',', '.')) || 0;
            totalBonus += parseFloat(cells[4].textContent.replace(',', '.')) || 0;
            totalFss += parseFloat(cells[5].textContent.replace(',', '.')) || 0;
            totalReplace += parseFloat(cells[6].textContent.replace(',', '.')) || 0;
            totalOtherIncome += parseFloat(cells[7].textContent.replace(',', '.')) || 0;
            totalEmployeeIncome += parseFloat(cells[8].textContent.replace(',', '.')) || 0;
            totalAbsent += parseFloat(cells[9].textContent.replace(',', '.')) || 0;
            totalUnionFee += parseFloat(cells[10].textContent.replace(',', '.')) || 0;
            totalIncomeTax += parseFloat(cells[11].textContent.replace(',', '.')) || 0;
            totalAdvance += parseFloat(cells[12].textContent.replace(',', '.')) || 0;
            totalEmployeeDeduction += parseFloat(cells[13].textContent.replace(',', '.')) || 0;
            totalIssued += parseFloat(cells[14].textContent.replace(',', '.')) || 0;
        });

        function formatNumber(num) {
            return num.toFixed(2).replace('.', ',');
        }

        document.getElementById('grand-total-salary').textContent = formatNumber(totalBaseSalary);
        document.getElementById('grand-total-bonus').textContent = formatNumber(totalBonus);
        document.getElementById('grand-total-fss').textContent = formatNumber(totalFss);
        document.getElementById('grand-total-replace').textContent = formatNumber(totalReplace);
        document.getElementById('grand-total-otherIncome').textContent = formatNumber(totalOtherIncome);
        document.getElementById('grand-total-income').textContent = formatNumber(totalEmployeeIncome);
        document.getElementById('grand-total-absent').textContent = formatNumber(totalAbsent);
        document.getElementById('grand-total-unionFee').textContent = formatNumber(totalUnionFee);
        document.getElementById('grand-total-incomeTax').textContent = formatNumber(totalIncomeTax);
        document.getElementById('grand-total-advance').textContent = formatNumber(totalAdvance);
        document.getElementById('grand-total-deduction').textContent = formatNumber(totalEmployeeDeduction);
        document.getElementById('grand-total-issued').textContent = formatNumber(totalIssued);
    }

    document.addEventListener('DOMContentLoaded', function() {
        calculateGrandTotals();
        console.log('Итоги рассчитаны автоматически');
    });
</script>
</body>
</html>
