<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ведомость</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/Styles.css">

</head>
<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand">
            <i class="bi bi-building me-2"></i>
            ВОС
            <span th:if="${selectedInstitution != null}"
                  class="badge bg-light text-dark ms-2"
                  th:text="${selectedInstitution.institutionAbbrev}">
            </span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" th:href="@{/home}"><i class="bi bi-house me-1"></i> Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-person-circle me-1"></i> Выход</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<body>
<div class="container-fluid mt-4">
    <div class="text-center mb-4">
        <h1 class="display-5">Расчетно-платежная ведомость</h1>
    </div>

    <form id="payrollForm">
        <div class="table-responsive">
            <table class="table professional-theme">
                <thead class="table-light">
                <tr>
                    <th rowspan="2" class="text-center fixed-col-small">№</th>
                    <th rowspan="2" class="text-center fixed-col-name">ФИО</th>
                    <th rowspan="2" class="text-center fixed-col-position">Должность</th>
                    <th colspan="5" class="text-center table-success">Начисления</th>
                    <th rowspan="2" class="text-center table-success calculated-cell">Всего начислено</th>
                    <th colspan="4" class="text-center table-danger">Удержания</th>
                    <th rowspan="2" class="text-center table-danger calculated-cell">Всего удержано</th>
                    <th rowspan="2" class="text-center table-primary calculated-cell">К выдаче</th>
                </tr>
                <tr>
                    <th class="text-center table-success">Оклад</th>
                    <th class="text-center table-success">Премия</th>
                    <th class="text-center table-success">ФСС</th>
                    <th class="text-center table-success">Замещение</th>
                    <th class="text-center table-success">Классное руководство</th>

                    <th class="text-center table-danger">Прогулы</th>
                    <th class="text-center table-danger">Проф взнос</th>
                    <th class="text-center table-danger">НДФЛ</th>
                    <th class="text-center table-danger">Аванс</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payrollItems, stat : ${payroll_items}">

                    <td class="text-center fixed-col-small" th:text="${stat.index + 1}">1</td>
                    <td class="fixed-col-name" th:text="${payrollItems.fullName()}"></td>
                    <td class="fixed-col-name" th:text="${payrollItems.position}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.baseSalary}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.bonus}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.fss}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.replace}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.otherIncome}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.totalEmployeeIncome}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.absent}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.unionFee}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.incomeTax}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.advance}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.totalEmployeeDeduction}"></td>
                    <td class="text-end fixed-col-position" th:text="${payrollItems.totalIssued}"></td>

                </tr>
                <tr class="total-row">
                    <td colspan="3" class="text-start"><strong>ИТОГО:</strong></td>
                    <td class="text-end" id="grand-total-salary">0.00</td>
                    <td class="text-end" id="grand-total-bonus">0.00</td>
                    <td class="text-end" id="grand-total-fss">0.00</td>
                    <td class="text-end" id="grand-total-replace">0.00</td>
                    <td class="text-end" id="grand-total-otherIncome">0.00</td>
                    <td class="text-end calculated-cell" id="grand-total-income">0.00</td>
                    <td class="text-end" id="grand-total-absent">0.00</td>
                    <td class="text-end" id="grand-total-unionFee">0.00</td>
                    <td class="text-end" id="grand-total-incomeTax">0.00</td>
                    <td class="text-end" id="grand-total-advance">0.00</td>
                    <td class="text-end calculated-cell" id="grand-total-deduction">0.00</td>
                    <td class="text-end calculated-cell" id="grand-total-issued">0.00</td>
                </tr>
                </tbody>
            </table>
            <div class="d-flex gap-3 justify-content-end">
                <a th:href="@{/payroll}" class="btn btn-cancel text-white">
                    <i class="bi bi-arrow-left me-2"></i> Назад
                </a>
            </div>
        </div>
    </form>
</div>
<script>
    // Функция для расчета общих итогов
    function calculateGrandTotals() {
        let totalBaseSalary = 0;
        let totalBonus = 0;
        let totalFss = 0;
        let totalReplace = 0;
        let totalOtherIncome = 0;
        let totalEmployeeIncome = 0;
        let totalAbsent = 0;
        let totalUnionFee = 0;
        let totalIncomeTax = 0;
        let totalAdvance = 0;
        let totalEmployeeDeduction = 0;
        let totalIssued = 0;

        // Получаем все строки данных (исключая итоговую строку)
        const rows = document.querySelectorAll('tbody tr:not(.total-row)');

        rows.forEach(row => {
            // Получаем ячейки текущей строки
            const cells = row.querySelectorAll('td');

            // Суммируем значения из каждой колонки
            totalBaseSalary += parseFloat(cells[3].textContent) || 0;        // Оклад
            totalBonus += parseFloat(cells[4].textContent) || 0;             // Премия
            totalFss += parseFloat(cells[5].textContent) || 0;               // ФСС
            totalReplace += parseFloat(cells[6].textContent) || 0;           // Замещение
            totalOtherIncome += parseFloat(cells[7].textContent) || 0;       // Классное руководство
            totalEmployeeIncome += parseFloat(cells[8].textContent) || 0;    // Всего начислено
            totalAbsent += parseFloat(cells[9].textContent) || 0;            // Прогулы
            totalUnionFee += parseFloat(cells[10].textContent) || 0;         // Проф взнос
            totalIncomeTax += parseFloat(cells[11].textContent) || 0;        // НДФЛ
            totalAdvance += parseFloat(cells[12].textContent) || 0;          // Аванс
            totalEmployeeDeduction += parseFloat(cells[13].textContent) || 0;// Всего удержано
            totalIssued += parseFloat(cells[14].textContent) || 0;           // К выдаче
        });

        // Обновляем итоговую строку
        document.getElementById('grand-total-salary').textContent = totalBaseSalary.toFixed(2);
        document.getElementById('grand-total-bonus').textContent = totalBonus.toFixed(2);
        document.getElementById('grand-total-fss').textContent = totalFss.toFixed(2);
        document.getElementById('grand-total-replace').textContent = totalReplace.toFixed(2);
        document.getElementById('grand-total-otherIncome').textContent = totalOtherIncome.toFixed(2);
        document.getElementById('grand-total-income').textContent = totalEmployeeIncome.toFixed(2);
        document.getElementById('grand-total-absent').textContent = totalAbsent.toFixed(2);
        document.getElementById('grand-total-unionFee').textContent = totalUnionFee.toFixed(2);
        document.getElementById('grand-total-incomeTax').textContent = totalIncomeTax.toFixed(2);
        document.getElementById('grand-total-advance').textContent = totalAdvance.toFixed(2);
        document.getElementById('grand-total-deduction').textContent = totalEmployeeDeduction.toFixed(2);
        document.getElementById('grand-total-issued').textContent = totalIssued.toFixed(2);
    }

    // Функция для форматирования чисел (если нужно)
    function formatNumber(value) {
        return parseFloat(value).toFixed(2);
    }


    // Автоматический расчет при загрузке страницы
    document.addEventListener('DOMContentLoaded', function() {

        // Выполняем первоначальный расчет
        calculateGrandTotals();

        console.log('Итоги рассчитаны автоматически');
    });
</script>
</body>
</html>
