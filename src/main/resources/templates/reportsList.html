<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Сформировать ведомость</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/TableStyles.css">
</head>

<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container-fluid mt-6">
    <div class="text-center mb-4">
        <h1 class="display-5">Отчетность</h1>
    </div>

    <form th:action="@{/report/select}" th:object="${reportResponse}" method="post"
          class="d-flex align-items-center gap-3 mb-4 p-3 bg-light rounded shadow-sm">

        <label class="form-label fw-bold mb-0">
            <i class="bi-bar-chart me-1"></i> Отчеты:
        </label>

        <div class="d-flex gap-2">
            <select class="form-select" th:field="*{report}" required>
                <option value="">Выберите отчетность</option>
                <option th:each="report : ${reportsList}"
                        th:value="${report}"
                        th:text="${report.getDisplayName()}">
                </option>
            </select>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-table me-1"></i> Сформировать
            </button>
            <a th:href="@{/home}" class="btn btn-outline-secondary">
                <i class="bi bi-house me-1"></i> На главную
            </a>
        </div>
    </form>
</div>
</body>
</html>
